[project]
name = "lms_neuro_a11y"
authors = [
    { name = "LogiSentinel", email = "soporte@logisentinel.com" }
]
description = "Neurodivergent-friendly accessibility, cognitive calibration, and LogiSentinel branding layer for Frappe LMS"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
lms = ">=2.0.0"
